      rel="stylesheet"
    />

    <!--
      Restores the saved theme / palette / sidebar state before first paint so
      there is never a flash of the wrong colours. Inline and dependency-free
      on purpose — it has to run before the bundle loads.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem("portfolio-theme");
          var palette = localStorage.getItem("portfolio-palette");

          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          root.setAttribute("data-theme", theme);
          root.setAttribute("data-palette", palette || "default");
          if (localStorage.getItem("portfolio-sidebar") === "collapsed") {
            root.setAttribute("data-sidebar", "collapsed");
          }
        } catch (e) {
          /* storage blocked — fall back to the markup defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
